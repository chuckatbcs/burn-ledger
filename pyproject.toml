[project]
name = "burn-ledger"
version = "0.9.0"
description = "Evidence-aware AI subscription burn and task-yield tracker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<0.28",
  "beautifulsoup4>=4.12,<5",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
